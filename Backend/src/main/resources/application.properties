# MongoDB: uses SPRING_DATA_MONGODB_URI env var on Render, falls back to localhost
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/finance}

# Port: uses PORT env var on Render (default 8081 locally)
server.port=${PORT:8081}

spring.main.banner-mode=off
logging.level.org.springframework=INFO

# MongoDB connection resilience - don't block startup forever
spring.data.mongodb.auto-index-creation=true
